name: Build Ashita 4 port

on:
  push:
    branches: [ashita4-port]
  pull_request:
    branches: [ashita4-port]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out Nameplate
        uses: actions/checkout@v4

      - name: Check out Ashita 4.30 SDK
        uses: actions/checkout@v4
        with:
          repository: AshitaXI/Ashita-v4beta
          ref: 2e4b9c86de538ecfedabab918537c550d6378aaa
          path: external/ashita

      - name: Configure 32-bit release build
        run: >-
          cmake -S . -B build -A Win32
          -DASHITA_SDK_PATH="${{ github.workspace }}/external/ashita/plugins/sdk"
          -DNAMEPLATE_ENABLE_PATCHES=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: Nameplate-Ashita4.30
          path: build/Release/Nameplate.dll
